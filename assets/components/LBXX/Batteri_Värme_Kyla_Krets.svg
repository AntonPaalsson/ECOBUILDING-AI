    <rect x="25" y="125" width="15" height="5" fill="#F1CD45"/>
    <rect x="10" y="135" width="55" height="5" fill="#F1CD45"/>
    
    <!-- Cooling pipe arrows -->
    <g transform="translate(92.5, 147.5) rotate(0)">
      <path d="m 2.5009766,-0.75802102 c -0.1278096,0 -0.2555814,0.0485501 -0.3535156,0.14648438 L -2.4501953,3.9841665 c -0.1958686,0.1958686 -0.1958686,0.5111627 0,0.7070312 l 0.9199219,0.9199219 c 0.1958686,0.1958686 0.5111626,0.1958686 0.70703122,0 L 2.4990234,2.288854 5.8232422,5.6111196 c 0.1958686,0.1958686 0.5111627,0.1958686 0.7070312,0 L 7.4501953,4.6911977 c 0.1958686,-0.1958685 0.1958686,-0.5111626 0,-0.7070312 L 2.8544922,-0.61153664 C 2.7565579,-0.70947093 2.6287861,-0.75802102 2.5009766,-0.75802102 Z" 
            fill="#42B4E6" stroke="#42B4E6" stroke-width="1"/>
    </g>
    
    <g transform="translate(117.5, 147.5) rotate(180)">
      <path d="m 2.5009766,-0.75802102 c -0.1278096,0 -0.2555814,0.0485501 -0.3535156,0.14648438 L -2.4501953,3.9841665 c -0.1958686,0.1958686 -0.1958686,0.5111627 0,0.7070312 l 0.9199219,0.9199219 c 0.1958686,0.1958686 0.5111626,0.1958686 0.70703122,0 L 2.4990234,2.288854 5.8232422,5.6111196 c 0.1958686,0.1958686 0.5111627,0.1958686 0.7070312,0 L 7.4501953,4.6911977 c 0.1958686,-0.1958685 0.1958686,-0.5111626 0,-0.7070312 L 2.8544922,-0.61153664 C 2.7565579,-0.70947093 2.6287861,-0.75802102 2.5009766,-0.75802102 Z" 
            fill="#42B4E6" stroke="#42B4E6" stroke-width="1"/>
    </g>
  </g>
  
  <!-- Komponenter (components) group -->
  <g id="Komponenter" transform="translate(20, 50)">
    
    <!-- P1 Pump -->
    <g id="P1" transform="translate(0, 0)">
      <ellipse cx="17.5" cy="17.5" rx="10" ry="10" fill="#FFFFFF" stroke="#808080" stroke-width="0.5"/>
      <path d="m 12.5,3.5 c -0.8,0 -1.16,0.68 -1.16,0.68 L 7,11.71 c -0.5,0.863 0.145,2 1.15,2.01 h 8.7 c 1,0 1.65,-1.14138 1.15,-2 L 13.66,4.18 c 0,0 -0.3647,-0.68 -1.16,-0.68 z" 
            fill="#C0C0C0" stroke="none" transform="translate(5, 5)"/>
      <text x="29" y="12" font-family="Arial" font-size="12" fill="#304760">P1</text>
      
      <!-- Manual override indicator -->
      <g transform="translate(24, 24)">
        <ellipse cx="7.5" cy="7.5" rx="7.5" ry="7.5" fill="#F68B1C" opacity="0" stroke="none"/>
        <path d="M 7.5,1.5 C 6.9,1.5 6.63,2 6.63,2 L 2.13,9.5 C 1.76,10.15 2.25,11 3,11 h 9 c 0.75,0 1.245,-0.85 0.87,-1.5 L 8.37,2 C 8.37,2 8.1,1.5 7.5,1.5 Z" 
              fill="#FFFFFF" stroke="#808080" stroke-width="0.5"/>
      </g>
    </g>
    
    <!-- SV21 Control Valve -->
    <g id="SV21" transform="translate(5, 75)">
      <rect x="10" y="7.5" width="15" height="15" fill="#F9F8FB" stroke="none"/>
      <path d="m 12.5,39 a 9,9 0 0 0 9,-9 A 9,9 0 0 0 13,21.025391 V 8.216797 L 24,13 V 2 L 12.5,7 1,2 V 13 L 12,8.216797 V 21.017578 A 9,9 0 0 0 3.5,30 a 9,9 0 0 0 9,9 z" 
            fill="#FFFFFF" stroke="#808080" stroke-width="0.5" transform="translate(5, 5) scale(0.65)"/>
      <text x="17.5" y="52" font-family="Arial" font-size="12" fill="#304760" text-anchor="middle">SV21</text>
      <text x="30" y="35" font-family="Arial" font-size="14" fill="#0087CD">0</text>
    </g>
    
    <!-- Heat exchanger (Värmeväxlare) -->
    <g id="Varmevaxlare" transform="translate(20.5, 42.5) rotate(90) scale(0.23)">
      <path d="m 2,132.5 h 13 v -35 L 20,95 10,90 20,85 10,80 20,75 10,70 20,65 10,60 15,57.5 v -35 H 2 m 36,0 H 25 v 35 l -5,2.5 10,5 -10,5 10,5 -10,5 10,5 -10,5 10,5 -5,2.5 v 35 H 38 M 7,0 A 7,7 0 0 0 0,7 v 13.5 l 2,2 -2,2 v 106 l 2,2 -2,2 V 148 a 7,7 0 0 0 7,7 h 26 a 7,7 0 0 0 7,-7 L 40.0625,134.375 38,132.5 l 2,-2 v -106 l -2,-2 2,-2 V 7 A 7,7 0 0 0 33,0 Z" 
            fill="#FFFFFF" stroke="#808080" stroke-width="0.5"/>
    </g>
    
    <!-- SV31 3-way valve -->
    <g id="SV31" transform="translate(85, 20)">
      <rect x="5" y="15" width="15" height="15" fill="#F9F8FB" stroke="none"/>
      <g transform="scale(-1, 1) translate(-45, 0)">
        <path d="m 1,12.5 a 9,9 0 0 0 9,9 9,9 0 0 0 8.9824,-8.5 H 31.7832 L 27,24 H 38 L 33.3847,13.384766 44,18 V 7 L 33.3847,11.6153 38,1 H 27 l 4.7832,11 H 18.9824 A 9,9 0 0 0 10,3.5 a 9,9 0 0 0 -9,9 z" 
              fill="#FFFFFF" stroke="#808080" stroke-width="0.5" transform="translate(0, 10)"/>
      </g>
      <text x="50" y="8" font-family="Arial" font-size="12" fill="#304760" text-anchor="end">SV31</text>
      <text x="35" y="43" font-family="Arial" font-size="14" fill="#0087CD" text-anchor="middle">0</text>
    </g>
  </g>
</svg>
