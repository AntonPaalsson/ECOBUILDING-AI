      <!-- Bottom rectangle (scaled) -->
      <path d="m 1,20 h 38 c 0.554,0 1,0.446 1,1 v 38 c 0,0.554 -0.446,1 -1,1 H 1 C 0.446,60 0,59.554 0,59 V 21 C 0,20.446 0.446,20 1,20 Z" 
            fill="#FFFFFF" stroke="#808080" stroke-width="0.5" transform="scale(1, 0.5)"/>
      
      <!-- Heat indicator (red plus circle) -->
      <g transform="translate(10, 0) scale(0.8)">
        <path d="m9.0,4.0 l0.0,5.0 -5.0,0.0 c-0.554,0 -1.0,0.446 -1.0,1.0 0.0,0.554 0.446,1.0 1.0,1.0 l5.0,0.0 0.0,5.0 c0.0,0.554 0.438,1.0 1.0,1.0 0.562,0.0 1.0,-0.446 1.0,-1.0 l0.0,-5.0 5.0,0.0 c0.554,0.0 1.0,-0.446 1.0,-1.0 0.0,-0.554 -0.446,-1.0 -1.0,-1.0 l-5.0,0.0 0.0,-5.0 c0.0,-0.554 -0.438,-1.0 -1.0,-1.0 -0.562,0.0 -1.0,0.446 -1.0,1.0 z m11.0,6.0 A10.0,10.0 0 0,1 10.0,20.0 10.0,10.0 0 0,1 0.0,10.0 10.0,10.0 0 0,1 10.0,0.0 10.0,10.0 0 0,1 20.0,10.0 z" 
              fill="#B10043" stroke="none"/>
      </g>
      
