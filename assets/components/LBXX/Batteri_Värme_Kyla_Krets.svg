      <g transform="translate(10, 20) scale(0.8)">
        <path d="m9.0,4.0 l0.0,5.0 -5.0,0.0 c-0.554,0 -1.0,0.446 -1.0,1.0 0.0,0.554 0.446,1.0 1.0,1.0 l5.0,0.0 0.0,5.0 c0.0,0.554 0.438,1.0 1.0,1.0 0.562,0.0 1.0,-0.446 1.0,-1.0 l0.0,-5.0 5.0,0.0 c0.554,0.0 1.0,-0.446 1.0,-1.0 0.0,-0.554 -0.446,-1.0 -1.0,-1.0 l-5.0,0.0 0.0,-5.0 c0.0,-0.554 -0.438,-1.0 -1.0,-1.0 -0.562,0.0 -1.0,0.446 -1.0,1.0 z m11.0,6.0 A10.0,10.0 0 0,1 10.0,20.0 10.0,10.0 0 0,1 0.0,10.0 10.0,10.0 0 0,1 10.0,0.0 10.0,10.0 0 0,1 20.0,10.0 z" 
              fill="#42B4E6" stroke="none"/>
        <rect x="8.5" y="2" width="3" height="7" fill="#42B4E6"/>
        <rect x="8.5" y="11" width="3" height="7" fill="#42B4E6"/>
      </g>
    </g>
    
    <!-- Rör Kyla (cooling pipe) - horizontal -->
    <rect x="60" y="90" width="55" height="5" fill="#42B4E6"/>
    
    <!-- Rör Värme vertical sections -->
    <rect x="115" y="60" width="5" height="30" fill="#F1CD45"/>
    <rect x="80" y="60" width="5" height="30" fill="#F1CD45"/>
    
    <!-- Backventil (check valve) -->
    <g id="Backventil" transform="translate(75, 65)">
      <rect x="0" y="2.5" width="15" height="15" fill="#F9F8FB" stroke="none"/>
      <path d="M 3.5214842,18 H 11.478516 L 8,10 11.478516,2.0000002 H 3.5214842 L 6.9999998,10 Z" 
            fill="#FFFFFF" stroke="#808080" stroke-width="0.5"/>
      <line x1="5" y1="15" x2="10" y2="15" stroke="#808080" stroke-width="0.5"/>
    </g>
    
    <!-- Rör Kyla vertical sections -->
