<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" 
     width="150" height="180" viewBox="0 0 150 180">
  <title>Batteri_Värme_Kyla_Krets</title>
  
  <!-- Rör (pipes) group -->
